<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig configuration for the USB stick (userland/make-stick.sh):
     fonts in /h/OS2/fonts, cache in the RAM file system. Used through
     FONTCONFIG_FILE=/h/OS2/fonts.conf (see desktop.sh). -->
<fontconfig>
  <dir>/h/OS2/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
