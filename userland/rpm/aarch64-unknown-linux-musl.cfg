# clang's defaults on OS/2 Warp ARM64 (/etc/clang, loaded for the system's
# target): static programs. lld links them at 0x60000000, the kernel's user
# window (llvm-23.1.5-os2warp-lld-base.patch); a program bigger than ~48 MB:
# -Wl,--image-base=0x100000000 -Wl,--defsym=_DYNAMIC=0x100000000.
# lld, compiler-rt, libc++ and libunwind are clang's built-in defaults.
-static
