name: Build os24arm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-image-and-iso:
    name: QEMU kernel image + dd-able ISO
    runs-on: ubuntu-24.04
    env:
      CC: clang-17
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: ci/scripts/install-deps-linux.sh

      - name: Build os2warp.img and os2warp-arm64.iso
        run: ci/scripts/build-qemu.sh build

      - uses: actions/upload-artifact@v6
        with:
          name: os24arm-qemu
          path: |
            build/os2warp.img
            build/os2warp-arm64.iso
          if-no-files-found: error

  rpi3-image:
    name: Raspberry Pi 3+ kernel image
    runs-on: ubuntu-24.04
    env:
      CC: clang-17
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: ci/scripts/install-deps-linux.sh

      - name: Build kernel8.img
        run: ci/scripts/build-rpi.sh build-rpi

      - uses: actions/upload-artifact@v6
        with:
          name: os24arm-rpi3
          path: build-rpi/kernel8.img
          if-no-files-found: error

  beagle-images:
    name: ${{ matrix.name }} kernel image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BeagleBone Black
            platform: BBB
            build_dir: build-bbb
            image: os2warp-bbb.img
            artifact: os24arm-bbb
            files: |
              build-bbb/os2warp-bbb.img
              build-bbb/uEnv.txt
          - name: BeagleV-Ahead
            platform: BEAGLEV_AHEAD
            build_dir: build-beaglev-ahead
            image: os2warp-beaglev-ahead.img
            artifact: os24arm-beaglev-ahead
            files: |
              build-beaglev-ahead/os2warp-beaglev-ahead.img
              build-beaglev-ahead/uEnv.txt
          - name: QEMU RISC-V
            platform: QEMU_RISCV
            build_dir: build-qemu-riscv
            image: os2warp-qemu-riscv.img
            artifact: os24arm-qemu-riscv
            files: |
              build-qemu-riscv/os2warp-qemu-riscv.img
    env:
      CC: clang-17
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: ci/scripts/install-deps-linux.sh

      - name: Build ${{ matrix.image }}
        run: ci/scripts/build-beagle.sh ${{ matrix.platform }} ${{ matrix.build_dir }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Packs each board's images into a .tar.gz and attaches them to a GitHub
  # Release: a tag v* gets its own release; a push to main (or a manual run)
  # of main refreshes the rolling "latest" pre-release. Pull requests and
  # other branches only build.
  release:
    name: Publish images (tar.gz) to GitHub Releases
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [qemu-image-and-iso, rpi3-image, beagle-images]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Pack images into tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/*/; do
            name="$(basename "${dir}")"
            tar -C "${dir}" -czf "dist/${name}.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Publish release
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            gh release create "${tag}" dist/* \
              --title "os24arm ${tag}" \
              --notes "Images built from ${tag} (${short})." \
              --verify-tag
          else
            tag=latest
            gh release delete "${tag}" --cleanup-tag --yes || true
            gh release create "${tag}" dist/* \
              --title "os24arm latest build (${short})" \
              --notes "Rolling build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Each .tar.gz holds one board's images; SHA256SUMS lists their checksums." \
              --target "${GITHUB_SHA}" \
              --prerelease
          fi
